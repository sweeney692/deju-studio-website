[build]
  publish = "."

[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/gallery.html"
  to = "/#gallery"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#visit"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
