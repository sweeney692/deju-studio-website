[build]
  publish = "."

[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301

[[redirects]]
  from = "/gallery.html"
  to = "/#gallery"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#visit"
  status = 301

[[redirects]]
  from = "/careers"
  to = "/#careers"
  status = 301

# Tolerant careers aliases - hiring-campaign links (IG bio, story stickers, typed
# flyer URLs) must never 404. Netlify redirect matching is case-sensitive and
# exact, so every plausible variant is listed explicitly. All land on /#careers.
[[redirects]]
  from = "/Careers"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/careers/*"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/career"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/hiring"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/jobs"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/job"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/apply"
  to = "/#careers"
  status = 301

[[redirects]]
  from = "/apply-now"
  to = "/#careers"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://maps.gstatic.com https://maps.googleapis.com https://www.google.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://googleads.g.doubleclick.net https://stats.g.doubleclick.net; frame-src 'self' https://www.google.com https://www.googletagmanager.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
